name: validator-rejects-twice-then-accepts
goal: write a status line
planner:
  - '{"action": "final", "answer": "draft one"}'
  - '{"action": "final", "answer": "draft two"}'
  - '{"action": "final", "answer": "draft three"}'
validator:
  - '{"approved": false, "reason": "vague"}'
  - '{"approved": false, "reason": "still vague"}'
  - '{"approved": true, "reason": "good"}'
expect:
