# A retryable planner failure should make the gateway fall back to the
# second route step (a "fallback" provider replaying the same scripted
# planner responses) rather than aborting the run.
#
# What the platform actually does: the planner's first call raises
# ProviderError(retryable=True); the gateway's fallback step, wired in
# because this case has a retryable provider fault, answers instead, and
# the run completes normally. This case recovers as designed: no
# correction needed.
name: provider-retryable-falls-back
goal: answer the goal
faults:
  - at: provider
    name: planner
    kind: retryable_error
    times: 1
planner:
  - '{"action": "final", "answer": "after fallback"}'
validator:
  - '{"approved": true, "reason": "ok"}'
expect:
  status: completed
  answer_contains: "after fallback"
  recovered: true
