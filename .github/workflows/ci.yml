name: ci
on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The ifeval extra is left out on purpose: the only test that needs it
      # is network-marked, so the pytest line below deselects it, and the
      # extra costs a git clone and a build on every push. The mcp extra is
      # in: pyright resolves the stdio fixture server's import against it,
      # and the MCP target tests run the fixture server in process.
      - run: pip install -e ".[dev,agent-platform,mcp]"
      # rung 1: static
      - run: ruff format --check .
      - run: ruff check .
      - run: pyright
      - run: bandit -q -r eval_platform
      - run: pytest -m "not network and not live"
      # rung 2: offline deterministic suites against the published agent platform, in process
      - run: evalplat run offline --suite-dir suites/offline_core --target agent-platform-local --results results
      - run: evalplat run offline --suite-dir suites/trajectory --target agent-platform-local --results results
      - run: evalplat run offline --suite-dir suites/faults --target agent-platform-local --results results
      - run: evalplat run offline --suite-dir suites/memory --target agent-platform-local --results results
      - run: evalplat run offline --suite-dir suites/injection --target agent-platform-local --results results
      # rung 3: judge-graded. CI has no GPU and no hosted credits, so it does
      # not call a judge. It reads the committed judge-graded results and the
      # committed calibration report instead: --check validates the report's
      # shape and prints each grader's calibrated verdict, and the gate step
      # below then reads the judge row out of results/groundedness/latest.json.
      # --check validates shape only; the gate is what matches a judge to a
      # row, and a judge row stays not_measured until that judge clears the
      # kappa floor.
      - run: evalplat calibrate --check results/calibration/latest.json
      # Two paths through the gate, because the committed baseline was
      # measured on a laptop and a runner is different hardware.
      #
      # On main, the baseline is re-measured from this run before the gate
      # reads it, so main records the runner's own cost and latency numbers
      # and every later pull request compares against hardware like its own.
      # The absolute thresholds still apply on main (the pass-rate floor, a
      # maximum), so a real regression fails here even against a refreshed
      # baseline; only the relative rows move.
      #
      # On a pull request this step is skipped and the gate compares against
      # the committed baseline, which is what makes a change in cost or
      # latency visible in review.
      - name: Re-measure the baseline on main
        if: github.ref == 'refs/heads/main'
        run: evalplat gate --update-baseline
      - run: evalplat gate --junit out/junit.xml --markdown out/gate.md
      - run: evalplat report --results results --out out/report.html --gate-markdown out/gate.md
      - name: Commit the re-measured baseline
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add baselines
          git diff --cached --quiet || (git commit -m "Update baselines from CI run [skip ci]" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: out/
      - name: Post gate table on the pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('out/gate.md') ? fs.readFileSync('out/gate.md', 'utf8') : 'gate.md missing';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      # rung 4 (nightly public benchmarks) is still run by hand; see README.
