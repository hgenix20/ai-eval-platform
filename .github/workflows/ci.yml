name: ci
on:
  push:
  pull_request:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,agent-platform,ifeval]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pyright
      - run: bandit -q -r eval_platform
      - run: pytest
