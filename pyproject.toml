[project]
name = "eval-platform"
version = "0.1.0"
description = "Evaluation and reliability platform for AI systems: benchmark catalog on an Inspect AI substrate, built suites for the gaps, and a CI regression gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kameron M. Green" }]
dependencies = [
    "inspect-ai==0.3.263",
    "inspect-evals==0.19.0",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "opentelemetry-api>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.6", "pyright>=1.1.380", "bandit>=1.7", "types-PyYAML", "opentelemetry-sdk>=1.44"]
agent-platform = ["agent-platform @ git+https://github.com/hgenix20/enterprise-agent-platform@d6fee0e"]
# mcp 2.x renamed FastMCP to MCPServer; the stdio fixture server under
# tests/fixtures uses the 2.x name, and Inspect 0.3.263's MCP client works
# against 2.x, so the floor here is 2.0 rather than the 1.10 Inspect itself
# asks for. Capped below 3 because the server API is what moved at the last
# major, and the fixture would break the same way again.
mcp = ["mcp>=2.0,<3"]
ifeval = [
    "instruction_following_eval @ git+https://github.com/josejg/instruction_following_eval@0c495b2f95155e8b10acb919ae283bfb4d5be6e2",
    "langdetect",
]
# CUDA builds of torch come from the PyTorch index, not PyPI: install torch
# first with `pip install --index-url https://download.pytorch.org/whl/cu124
# torch==2.6.0`, then `pip install -e ".[local]"` for the rest. torch is
# deliberately not a core dependency: most of this platform's suites never
# load a model in process.
local = ["torch>=2.6", "transformers>=4.45", "accelerate>=1.0", "safetensors>=0.4", "huggingface_hub>=0.25"]

[project.scripts]
evalplat = "eval_platform.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eval_platform*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF", "ASYNC", "ARG", "PL"]
ignore = ["PLR0913", "PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR", "ARG"]

[tool.pyright]
include = ["eval_platform", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# No venvPath/venv here: pyright is always run from the active environment
# (.venv/Scripts/pyright locally, the runner's pip environment in CI).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: needs internet",
    "live: needs an API key and spends money",
    "agent_platform: needs the agent-platform extra",
    "gpu: loads a real model on this machine's GPU or CPU; never in CI",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
