notes: A de-duplicated successor to SimpleQA. License is unverified. The inspect_evals task
  loads the codelion/SimpleQA-Verified mirror on Hugging Face at a pinned revision, not the
  google/simpleqa-verified card this entry cites; the fields match. Scoring is a model grader
