notes: The airline domain of tau2-bench, run through inspect_evals' tau2_airline task; the
  repo's other domains are the sibling entries tau2-retail, tau2-telecom, and tau2-banking,
  and the repo also ships tau3-bench v1.0.1 (full-duplex voice), which has no Inspect task.
  Task count read from the installed inspect_evals 0.19.0 data on 2026-09-16. The simulated
  user is a second model on Inspect's user role, which falls back to --model when nothing
  else is configured. inspect_evals' own README warns the airline domain used about 60 million
  tokens on one small hosted model, so --limit and a message_limit task arg are the way to
  sample it. Constructed and run on mockllm 2026-09-15 through evalplat run public.
