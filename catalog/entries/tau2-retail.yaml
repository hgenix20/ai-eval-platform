notes: 'The retail domain of tau2-bench, run through inspect_evals'' tau2_retail task. Task
  count read from the installed inspect_evals 0.19.0 data on 2026-09-16; the upstream README
  states no per-domain counts. The simulated user is a second model on Inspect''s user role,
  which falls back to --model when nothing else is configured. inspect_evals'' own README
  warns the airline domain used about 60 million tokens on one small hosted model, so --limit
  and a message_limit task arg are the way to sample it. Sibling entries: tau2-bench (airline),
  tau2-telecom, tau2-banking. Constructed and run on mockllm 2026-09-16 through evalplat run
  public.'
